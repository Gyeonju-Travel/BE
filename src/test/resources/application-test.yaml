spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:gyeonju-travel-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-secret-key-test-secret-key-test-secret-key-test-secret-key
  access-token-expiration-minutes: 60
  refresh-token-expiration-days: 14

app:
  storage:
    provider: local
  place-data:
    initialize: false
