server:
  forward-headers-strategy: framework

spring:
  application:
    name: Gyeonju-Travel

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL JDBC 드라이버 클래스입니다.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
  refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}

app:
  storage:
    provider: ${STORAGE_PROVIDER:s3}
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION:ap-northeast-2}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@gyeonju-travel.local}}
  password-reset:
    code-expiration-minutes: ${PASSWORD_RESET_CODE_EXPIRATION_MINUTES:5}
    reset-token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:10}
  schedule:
    matrix-cache-ttl: ${SCHEDULE_MATRIX_CACHE_TTL:24h}
    preview-ttl: ${SCHEDULE_PREVIEW_TTL:30m}

tmap:
  base-url: ${TMAP_BASE_URL:https://apis.openapi.sk.com}
  app-key: ${TMAP_APP_KEY:}
