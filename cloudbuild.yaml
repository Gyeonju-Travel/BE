steps:
  # 1. Spring Boot 프로젝트 빌드 (JAR 생성)
  - name: 'gradle:8-jdk21'
    args: ['gradle', 'clean', 'bootJar']

  # 2. Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/gyeonju-repo/gyeonjutravel-backend:latest'
      - '.'

  # 3. Artifact Registry에 이미지 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/gyeonju-repo/gyeonjutravel-backend:latest'

  # 4. Cloud Run 배포
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'gyeonjutravel-service'
      - '--image'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/gyeonju-repo/gyeonjutravel-backend:latest'
      - '--region'
      - 'asia-northeast3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

      # 일반 환경 변수 설정
      - '--set-env-vars'
      - 'STORAGE_PROVIDER=gcs,OPENAI_MODEL=gpt-4.1-mini'

      # Secret Manager 연결 (보안 키 및 인프라 접속 정보)
      - '--set-secrets'
      - 'DB_URL=DB_URL:latest,DB_USER=DB_USER:latest,DB_PW=DB_PW:latest,JWT_SECRET=JWT_SECRET:latest,MAIL_USERNAME=MAIL_USERNAME:latest,MAIL_PASSWORD=MAIL_PASSWORD:latest,TMAP_APP_KEY=TMAP_APP_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GCS_BUCKET=GCS_BUCKET:latest,GCS_PUBLIC_BASE_URL=GCS_PUBLIC_BASE_URL:latest'

options:
  logging: CLOUD_LOGGING_ONLY
