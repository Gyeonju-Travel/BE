name: Deploy

on:
  push:
    branches: ["deploy"]

permissions:
  contents: read

concurrency:
  group: gyeonju-travel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t sungminju/weartrack:gyeonju-travel .
          docker push sungminju/weartrack:gyeonju-travel

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.ELASTIC_IP }}
          username: ubuntu
          key: ${{ secrets.PEM_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -eu
            cd /home/ubuntu/gyeonju-travel
            test -f env
            test -f docker-compose.yml
            test -f secrets/firebase-adminsdk.json

            printf '%s' "$DOCKER_PASSWORD" | sudo docker login \
              --username "$DOCKER_USERNAME" --password-stdin

            if sudo docker compose version >/dev/null 2>&1; then
              sudo docker compose pull app
              sudo docker compose up -d app
            else
              sudo docker-compose pull app
              sudo docker-compose up -d app
            fi
